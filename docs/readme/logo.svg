<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Photo Twins logo" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6DE"/><stop offset=".55" stop-color="#E8E4FF"/><stop offset="1" stop-color="#D9F3E7"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/></linearGradient></defs><style>.pair{animation:pair 4s ease-in-out infinite}.pair2{animation:pair2 4s ease-in-out infinite}
.scan{animation:scan 3.2s ease-in-out infinite}.pop{transform-box:fill-box;transform-origin:center;animation:pop 4s ease-in-out infinite}
@keyframes pair{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-14px,-6px) rotate(-3deg)}}
@keyframes pair2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,6px) rotate(3deg)}}
@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(150px)}}
@keyframes pop{0%,40%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="240" height="240" rx="56" fill="url(#lg)"/>
